{% extends "base.html" %}

{% block main-content %}
<div class="row justify-content-center" style="padding-top:20px;">
  <div class="col-md-5 col-lg-4">
    <div class="bg-white rounded-4 shadow-sm p-5" style="border:1px solid var(--border);">
      <div class="text-center mb-4">
        <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));
                    display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;margin:0 auto 12px;">
          🔑
        </div>
        <h4 style="font-weight:700;color:var(--text);">Đăng nhập</h4>
        <p style="color:var(--text-muted);font-size:0.9rem;">Chào mừng bạn quay lại!</p>
      </div>

      {% if error %}
      <div class="alert alert-danger rounded-3 mb-3" style="font-size:0.88rem;">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ request.url_for('login_post') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label" style="font-weight:500;font-size:0.88rem;color:#4a5568;">Tên đăng nhập</label>
          <input type="text" name="username" class="form-control" placeholder="username" required
                 style="border-radius:8px;padding:10px 14px;">
        </div>
        <div class="mb-4">
          <label class="form-label" style="font-weight:500;font-size:0.88rem;color:#4a5568;">Mật khẩu</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required
                 style="border-radius:8px;padding:10px 14px;">
        </div>
        <button type="submit" class="btn w-100 py-2"
                style="background:var(--primary);color:white;border-radius:10px;font-weight:700;font-size:1rem;">
          Đăng nhập
        </button>
      </form>

      <div class="text-center mt-4" style="font-size:0.88rem;color:var(--text-muted);">
        Chưa có tài khoản?
        <a href="{{ request.url_for('register') }}" style="color:var(--primary);font-weight:600;">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
