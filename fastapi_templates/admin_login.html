<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Đà Nẵng Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0c4a6e 0%, #0e7490 50%, #0c4a6e 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(14,116,144,0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(8,145,178,0.3) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating shapes */
    .shape {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .shape-1 { width: 400px; height: 400px; top: -100px; right: -100px; }
    .shape-2 { width: 250px; height: 250px; bottom: -80px; left: -80px; }
    .shape-3 { width: 150px; height: 150px; top: 40%; left: 10%; }

    /* Card */
    .login-card {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Logo */
    .logo-wrap {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 36px; gap: 14px;
    }
    .logo-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #0891b2, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 24px rgba(6,182,212,0.5), 0 0 0 3px rgba(255,255,255,0.1);
    }
    .logo-title {
      color: white; font-size: 1.35rem; font-weight: 800;
      text-align: center; line-height: 1.2;
    }
    .logo-sub {
      color: rgba(255,255,255,0.55); font-size: 0.78rem;
      font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      margin-top: 2px;
    }

    /* Badge */
    .admin-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(249,115,22,0.2); border: 1px solid rgba(249,115,22,0.4);
      color: #fb923c; padding: 4px 12px; border-radius: 999px;
      font-size: 0.73rem; font-weight: 700; letter-spacing: 0.06em;
      margin-top: 4px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; color: rgba(255,255,255,0.6);
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: white; font-size: 0.95rem; font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .form-input:focus {
      border-color: #0891b2;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(8,145,178,0.2);
    }

    /* Error */
    .error-box {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 12px; padding: 12px 16px;
      color: #fca5a5; font-size: 0.85rem;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }

    /* Button */
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #0e7490, #0891b2);
      border: none; border-radius: 12px;
      color: white; font-size: 0.97rem; font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(8,145,178,0.45);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(8,145,178,0.55);
    }
    .btn-login:active { transform: translateY(0); }

    /* Footer links */
    .card-footer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .footer-link {
      color: rgba(255,255,255,0.45); font-size: 0.82rem;
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: color 0.15s;
    }
    .footer-link:hover { color: rgba(255,255,255,0.8); }
    .footer-divider {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .footer-row { display: flex; align-items: center; gap: 12px; }

    /* Version badge */
    .version {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.2); font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="login-card">
    <div class="logo-wrap">
      <div class="logo-icon">🏪</div>
      <div>
        <div class="logo-title">Đà Nẵng Store</div>
        <div class="logo-sub">Quản trị hệ thống</div>
      </div>
      <span class="admin-badge">🔐 Admin Portal</span>
    </div>

    {% if error %}
    <div class="error-box">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/quan-tri/login/">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input
          type="text" id="username" name="username"
          class="form-input" placeholder="Nhập username admin..."
          autocomplete="username" autofocus required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input
          type="password" id="password" name="password"
          class="form-input" placeholder="••••••••"
          autocomplete="current-password" required
        >
      </div>

      <button type="submit" class="btn-login">
        <span>🔓</span> Đăng nhập vào Admin Panel
      </button>
    </form>

    <div class="card-footer">
      <div class="footer-row">
        <a href="/" class="footer-link">🏠 Về trang chủ</a>
        <div class="footer-divider"></div>
        <a href="/login/" class="footer-link">👤 Đăng nhập user</a>
      </div>
      <div style="color:rgba(255,255,255,0.2);font-size:0.72rem;text-align:center;">
        Chỉ dành cho quản trị viên và nhân viên
      </div>
    </div>
  </div>

  <div class="version">Đà Nẵng Store v1.0</div>
</body>
</html>
