{% extends "sqladmin_original/layout.html" %}

{% block content_header %}
{{ super() }}
{% endblock %}

{# Inject Dashboard button + custom style into the sidebar via head block #}
{% block head %}
{{ super() }}
<style>
  /* Dashboard shortcut button */
  .dn-dashboard-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 12px 4px;
    padding: 9px 14px;
    border-radius: 8px;
    background: rgba(14, 116, 144, 0.85);
    color: #fff !important;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none !important;
    border: 1px solid rgba(255,255,255,0.18);
    transition: background 0.15s;
  }
  .dn-dashboard-btn:hover {
    background: rgba(14, 116, 144, 1);
    color: #fff !important;
  }
  /* Title override */
  .navbar-brand h3 { font-size: 1rem !important; }
</style>
{% endblock %}

{% block body %}
{{ super() }}
<script>
  // Inject Dashboard link into sidebar after page loads
  document.addEventListener('DOMContentLoaded', function () {
    var sidebar = document.querySelector('.navbar-vertical .navbar-collapse, .navbar-vertical [id="navbarSupportedContent"]');
    if (!sidebar) return;

    var btn = document.createElement('a');
    btn.href = '/quan-tri/';
    btn.className = 'dn-dashboard-btn';
    btn.innerHTML = '<span>📊</span><span>Dashboard Quản trị</span>';

    sidebar.parentNode.insertBefore(btn, sidebar);

    // Also highlight current nav item
    var cur = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function(a) {
      if (a.getAttribute('href') === cur) {
        a.classList.add('active');
      }
    });
  });
</script>
{% endblock %}
