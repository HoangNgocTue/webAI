<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #dbe4ea; stroke-width: 2; rx: 18; }
      .ok { fill: #dcfce7; stroke: #22c55e; }
      .warn { fill: #ffedd5; stroke: #f97316; }
      .err { fill: #fee2e2; stroke: #ef4444; }
      .info { fill: #e0f2fe; stroke: #0284c7; }
      .purple { fill: #f3e8ff; stroke: #9333ea; }
      .label { font: 800 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 17px Arial, sans-serif; fill: #334155; }
      .small { font: 500 15px Arial, sans-serif; fill: #475569; }
      .mono { font: 600 15px Consolas, monospace; fill: #0f172a; }
      .terminal { fill: #0f172a; rx: 14; }
      .terminalText { font: 600 15px Consolas, monospace; fill: #d1fae5; }
      .terminalErr { font: 600 15px Consolas, monospace; fill: #fecaca; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="70" y="70">Kiểm thử chức năng và log lỗi</text>
  <text class="subtitle" x="70" y="104">Các màn hình nên chụp để đưa vào báo cáo thực tập tốt nghiệp</text>

  <rect class="card info" x="70" y="155" width="300" height="190"/>
  <text class="label" x="105" y="198">1. Kiểm thử Contact</text>
  <text class="text" x="105" y="232">Nhập form /contact</text>
  <text class="text" x="105" y="264">Gửi liên hệ thành công</text>
  <text class="text" x="105" y="296">Sinh mã ticket mới</text>
  <text class="mono" x="105" y="326">/contact/</text>

  <rect class="card ok" x="420" y="155" width="300" height="190"/>
  <text class="label" x="455" y="198">2. Kiểm thử Ticket</text>
  <text class="text" x="455" y="232">Vào trang quản trị</text>
  <text class="text" x="455" y="264">Xem ticket vừa tạo</text>
  <text class="text" x="455" y="296">Đổi trạng thái / phản hồi</text>
  <text class="mono" x="455" y="326">/quan-tri/tickets/</text>

  <rect class="card purple" x="770" y="155" width="300" height="190"/>
  <text class="label" x="805" y="198">3. Kiểm thử Chatbot</text>
  <text class="text" x="805" y="232">Hỏi sản phẩm laptop</text>
  <text class="text" x="805" y="264">Thêm / xóa giỏ hàng</text>
  <text class="text" x="805" y="296">Lưu lịch sử chat</text>
  <text class="mono" x="805" y="326">/api/chatbot/</text>

  <rect class="card warn" x="1120" y="155" width="210" height="190"/>
  <text class="label" x="1150" y="198">4. Kiểm thử lỗi</text>
  <text class="text" x="1150" y="232">Sai API key</text>
  <text class="text" x="1150" y="264">Thiếu dữ liệu</text>
  <text class="text" x="1150" y="296">HTTP 500</text>
  <text class="mono" x="1150" y="326">Terminal log</text>

  <path class="arrow" d="M370 250 L420 250"/>
  <path class="arrow" d="M720 250 L770 250"/>
  <path class="arrow" d="M1070 250 L1120 250"/>

  <rect class="card" x="70" y="405" width="580" height="180"/>
  <text class="label" x="105" y="448">Chụp màn hình kiểm thử chức năng</text>
  <text class="text" x="105" y="484">- Trang chủ / danh mục / chi tiết sản phẩm</text>
  <text class="text" x="105" y="516">- Giỏ hàng, checkout, lịch sử đơn hàng, hóa đơn</text>
  <text class="text" x="105" y="548">- Contact tạo ticket và quản trị ticket tại /quan-tri</text>

  <rect class="card" x="710" y="405" width="620" height="180"/>
  <text class="label" x="745" y="448">Chụp màn hình log lỗi</text>
  <text class="text" x="745" y="484">- Terminal chạy Uvicorn khi request thành công / lỗi</text>
  <text class="text" x="745" y="516">- Docker logs nếu chạy bằng container</text>
  <text class="text" x="745" y="548">- DevTools Network nếu form/API trả lỗi</text>

  <rect class="terminal" x="70" y="640" width="600" height="185"/>
  <text class="terminalText" x="100" y="680">INFO: 127.0.0.1:60492 - "POST /contact/ HTTP/1.1" 200 OK</text>
  <text class="terminalText" x="100" y="716">INFO: 127.0.0.1:59997 - "GET /quan-tri/tickets/ HTTP/1.1" 200 OK</text>
  <text class="terminalErr" x="100" y="752">ERROR: AI Fallback Error: AuthenticationError - invalid api key</text>
  <text class="terminalText" x="100" y="788">Lệnh xem log Docker: docker compose logs -f web</text>

  <rect class="terminal" x="730" y="640" width="600" height="185"/>
  <text class="terminalText" x="760" y="680">Kịch bản test nên ghi trong báo cáo:</text>
  <text class="terminalText" x="760" y="716">1. Nhập dữ liệu hợp lệ → hệ thống lưu DB và hiển thị ticket</text>
  <text class="terminalText" x="760" y="752">2. Nhập thiếu email/nội dung → hệ thống báo lỗi form</text>
  <text class="terminalText" x="760" y="788">3. Lỗi API/SMTP → terminal ghi log để kỹ thuật viên xử lý</text>
</svg>
