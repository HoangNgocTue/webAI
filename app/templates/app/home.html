{% extends 'app/base.html' %}
{% load static %}
{% load currency %}
{% block banner_slider %}
<div id="carouselExampleControlsNoTouching" class="carousel slide" data-bs-touch="false">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner"  style="border-radius: 20px;">
    <div class="carousel-item active">
      <img src="{% static 'app/images/banner/bb1.jpg' %}" class="d-block w-100" alt="..." style="height: 550px;"> 
    </div>
    <div class="carousel-item">
      <img src="{% static 'app/images/banner/bb2.jpg' %}" class="d-block w-100" alt="..." style="height: 550px;"> 
    </div>
    <div class="carousel-item">
      <img src="{% static 'app/images/banner/bb3.jpg' %}" class="d-block w-100" alt="..." style="height: 550px;"> 
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
{% endblock %}

{% block main-content %}
<div style="background: #64b0c3;padding-top: 70px;" class="row" >
  {%for product in products %}
  <div class="col-lg-4 col-md-6 mb-4" >
    <div class="card"style="border-radius: 35px;" >
      <img src="{{product.ImageURL}}" class="card-img-top" alt="" height="300px" style="border-radius: 35px;transition: transform 0.3s ease, box-shadow 0.3s ease; /* Hiệu ứng mượt */">
      <div class="card-body d-flex flex-column">
        <h6><strong>{{product.name}}</strong></h6>
        <hr>

        <div class="d-flex justify-content-between align-items-center"  >
          <button data-product={{product.id}} data-action= "add" class="btn btn-outline-secondary add-btn update-cart" style="border-radius: 35px; background: #5a9daa; margin-right: 50px;border: 1px solid #0a0a0a; color:#0b0c0c">Thêm vào giỏ hàng</button>
          <a class="btn btn-outline-success"style="border-radius: 35px;background: #f5eff2; width: 90px; border: 1px solid #66b090; color:#66b090;" href="{% url 'detail' %}?id={{product.id}}">Xem</a>
        </div>
        <h4 class="mt-3"><strong>{{ product.price|vnd }}</strong></h4>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
