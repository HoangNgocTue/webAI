services:
  db:
    image: postgres:16-alpine
    container_name: danang_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: danang_store
      POSTGRES_USER: danang_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danang_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danang_user -d danang_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: danang_store_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://danang_user:${POSTGRES_PASSWORD:-danang_pass_2024}@db:5432/danang_store
      SECRET_KEY: ${SECRET_KEY:-danang-store-production-secret-change-me}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-danang-admin-production-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - static_images:/app/static/images

volumes:
  postgres_data:
  static_images:
